name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 Linux and Windows, plus ARM64 Linux (the benchmarks were measured on ARM64).
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Yaml.slnx

      - name: Build
        run: dotnet build Yaml.slnx -c Release --no-restore -warnaserror

      # Official yaml-test-suite (events, rejected inputs, JSON equivalence) + unit tests + mutation fuzz.
      - name: Test
        run: dotnet test --project tests/YamlD.Tests -c Release --no-build --report-trx --results-directory TestResults

      - name: Conformance report (yaml-test-suite)
        run: dotnet run -c Release --no-build --project tools/SuiteRunner -- tests/YamlD.Tests/suite

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  package:
    name: NuGet package
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/YamlD -c Release -o artifacts

      - name: Check the package contents
        run: |
          ls -l artifacts
          unzip -l artifacts/YamlD.*.nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error

  # Publishing only happens for a version tag (v0.0.1, v1.2.3, ...) and needs a NUGET_API_KEY repository secret.
  publish:
    name: Publish to nuget.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
